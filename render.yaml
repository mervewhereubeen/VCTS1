services:
  - type: web
    name: vcts
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_WEIGHTS_PATH
        value: models/weights/best.pt
    healthCheckPath: /health
    autoDeploy: false